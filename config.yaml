hotkey:
  modifiers: ["super", "alt"]
  key: "space"

stt:
  engine: "whisper"
  # Run incremental transcription while recording. Only useful once live
  # injection of partial results is implemented; costs continuous inference.
  streaming_enabled: false
  whisper:
    model: "base"
    device: "auto"
    compute_type: "int8"
    language: "en"
    beam_size: 5
  vosk:
    model_name: "vosk-model-small-en-us-0.15"

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  device: null

injection:
  method: "auto"
  # Delay between simulated keystrokes (xdotool --delay), in ms PER CHARACTER.
  # 0 = as fast as possible; raise only if an app drops characters.
  delay_ms: 0

vad:
  enabled: true
  threshold: 0.5
  min_speech_ms: 250
  silence_ms: 500

tray:
  enabled: true
  notifications: true

logging:
  level: "INFO"
  file: null

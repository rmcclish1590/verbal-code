hotkey:
  modifiers: ["super", "alt"]
  key: "space"
  # "hold" = push-to-talk (record while the chord is held).
  # "toggle" = press once to start, press again to stop.
  mode: "hold"

stt:
  # Two recommended presets (switch any time from the tray's Model menu;
  # the tray saves your choice back to this file):
  #
  #   Push-to-talk (default): text arrives in one batch on hotkey release.
  #     engine: "parakeet"        parakeet.model: "nemo-parakeet-tdt-0.6b-v2"
  #     streaming_enabled: false
  #
  #   Live streaming: each utterance is typed as soon as you pause.
  #     engine: "sherpa"
  #     sherpa.model: "sherpa-onnx-nemotron-speech-streaming-en-0.6b-560ms-int8-2026-04-25"
  #     streaming_enabled: true
  #
  # Engines: "parakeet", "sherpa", "whisper", "moonshine", "vosk".
  engine: "parakeet"
  # Inference threads for parakeet, sherpa, and whisper. Unset = one per
  # physical CPU core (6 on a Ryzen 5 5600G), which is usually fastest;
  # SMT/hyper-threads add contention rather than speed.
  # cpu_threads: 6
  # Live injection while you speak. With the sherpa or vosk engine, each
  # utterance is typed into the focused window as it finalises (a pause ends
  # an utterance); releasing the hotkey flushes the last one. Parakeet,
  # Whisper, and Moonshine have no final-text streaming, so this setting has
  # no effect there: those engines always transcribe and inject in one batch
  # on release.
  # Costs continuous inference while recording (sherpa/vosk only).
  streaming_enabled: false
  whisper:
    # English-only distil model: near-small accuracy at a lower CPU cost.
    # Other good picks: "small.en" (more accurate, slower), "base.en" (faster).
    model: "distil-small.en"
    device: "auto"
    compute_type: "int8"
    language: "en"
    # 2 is ~2x faster than 5 on CPU with negligible accuracy loss on short
    # dictations; raise to 5 if you notice misrecognitions on long sentences.
    beam_size: 2
    # Parallel-decode batch size for BatchedInferencePipeline.
    batch_size: 8
    # Optional vocabulary hint to bias spelling of names/jargon, e.g.
    # "Kaeden, numpy, ctranslate2, async, kwargs".
    initial_prompt: ""
  # Parakeet: NVIDIA Parakeet TDT on onnxruntime (INT8). Very fast, highly
  # accurate batch transcription with punctuation and capitalisation.
  # Downloaded from Hugging Face by install.sh, or on first use (~660 MB).
  parakeet:
    # Or "nemo-parakeet-tdt-0.6b-v3" (multilingual, ~670 MB), or
    # "nemo-parakeet-tdt_ctc-110m" (English, ~140 MB, for slower CPUs).
    model: "nemo-parakeet-tdt-0.6b-v2"
    # "int8" (fast) or "" for the full-precision model (larger, slower).
    quantization: "int8"
  # sherpa-onnx: true live streaming (use with streaming_enabled: true).
  # Punctuated, capitalised output. Downloaded and checksum-verified into
  # ~/.cache/verbal-code/sherpa-onnx/ on first use.
  sherpa:
    # ~57 MB. Or "sherpa-onnx-nemotron-speech-streaming-en-0.6b-560ms-int8-2026-04-25"
    # (~464 MB, more accurate).
    model: "sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06"
  vosk:
    model_name: "vosk-model-small-en-us-0.15"
  # Moonshine: fast English-only ASR (onnxruntime, no torch). Good on weak CPUs.
  moonshine:
    model: "moonshine/base"  # or "moonshine/tiny" (faster, less accurate)

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  device: null
  # Longest single recording, in seconds. Audio is buffered in memory
  # (~3.8 MB/min), so a toggle-mode dictation left running would otherwise
  # grow without bound; hitting the cap stops the recording and transcribes
  # what was captured. 0 disables the cap.
  max_seconds: 300

vad:
  # Trim leading/trailing silence from the recording before batch
  # transcription (energy-based, no extra dependencies). Whisper's built-in
  # VAD filter would cope without it; Vosk and Moonshine benefit directly.
  trim_silence: true
  # Frames with RMS energy below this (dBFS) count as silence. Raise towards
  # -30 in noisy rooms, lower towards -50 if quiet speech gets clipped.
  trim_threshold_db: -40.0

injection:
  method: "auto"
  # Delay between simulated keystrokes (xdotool --delay), in ms PER CHARACTER.
  # 0 = as fast as possible; raise only if an app drops characters.
  delay_ms: 0
  # With method "auto": dictations this many characters or longer are pasted
  # via the clipboard instead of typed (instant, regardless of length).
  # 0 disables the switch and always types.
  clipboard_threshold: 100
  # Spoken commands: "period", "comma", "question mark", "exclamation mark",
  # "colon", "semicolon", "ellipsis", "new line", "new paragraph", "full stop".
  # Sentence starts are capitalised automatically. Disable to type command
  # words literally.
  punctuation_commands: true

dictionary:
  # Corrects known-mangled proper nouns, jargon, and acronyms before
  # injection, using the term store managed via the tray/CLI (see
  # `verbal_code.dictionary`). No-op until you add terms.
  enabled: true
  # How close a mangled word has to be to a dictionary term (0-1, via
  # difflib's ratio) before it's corrected. Lower catches more mishearings
  # but risks correcting words that were already right; raise if you see
  # false corrections.
  fuzzy_threshold: 0.82
  # Defaults to ~/.config/verbal-code/dictionary.json when unset.
  path: null

tray:
  enabled: true
  notifications: true

logging:
  level: "INFO"
  # Also write the log to a file, e.g. "~/.config/verbal-code/verbal-code.log"
  # (the directory must exist). Needed for the tray's Logging... window,
  # which shows each dictation's latency. See "Logging" in the README.
  file: null
  # Log the transcribed text itself. Off by default: dictation can contain
  # passwords or personal details, and logs (especially a configured file)
  # persist in plaintext. When off, only character counts are logged.
  log_transcripts: false
